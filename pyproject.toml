[project]
name = "migu-travel-agent-training"
version = "2.0.0"
description = "文旅 Agent 工程化实战课程：Dify 主实现、Travel Core 业务内核、LangGraph 局部代码实验"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.116,<1",
  "jsonschema>=4.25,<5",
  "openai>=3.6.0",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "arize-phoenix-client[evals,pytest]>=2.10.0",
  "arize-phoenix-otel>=0.17.1",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "openinference-instrumentation-openai>=0.1.57",
  "pymupdf>=1.26,<2",
  "pytest>=8.4,<9",
  "reportlab>=4,<5",
  "ruff>=0.12,<1",
  "watchfiles>=1.1,<2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archived", ".git", ".venv", "__pycache__"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
