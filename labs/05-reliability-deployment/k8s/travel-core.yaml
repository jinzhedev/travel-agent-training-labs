apiVersion: v1
kind: Namespace
metadata:
  name: travel-agent-lab05
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: travel-agent-lab05
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: travel-agent-lab05
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: travel
            - name: POSTGRES_DB
              value: travel
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab05-secrets
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "travel", "-d", "travel"]
            periodSeconds: 2
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: travel-core
  namespace: travel-agent-lab05
spec:
  selector:
    app: travel-core
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-core
  namespace: travel-agent-lab05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-core
  template:
    metadata:
      labels:
        app: travel-core
    spec:
      containers:
        - name: travel-core
          image: migu-travel-core:lab05-runtime-v1
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lab05-secrets
                  key: database-url
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: lab05-secrets
                  key: api-key
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 2
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
