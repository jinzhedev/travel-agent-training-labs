              kind=poi 时调用 poi_search，使用任务的 city 和 date，按 query 提取筛选条件。

              query 包含“亲子”时，必须同时传 tags=["亲子"]，不能只传 city 和 date。

              每个任务只调用对应工具一次。调用工具的消息只包含 tool_calls，content 留空，

              不要先写“我来查询”或英文调用说明；工具返回后再生成最终中文回答。

