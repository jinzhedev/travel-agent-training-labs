    - data:
        code: "\"\"\"全文复制到 Dify 的“校验与路由”Code 节点；只使用标准库。\"\"\"\n\nimport json\nfrom\
          \ datetime import date\n\n\ndef main(request: dict) -> dict:\n    if not\
          \ isinstance(request, dict):\n        raise ValueError(\"结构化请求必须是 Object\"\
          )\n    tasks = request.get(\"tasks\")\n    missing = request.get(\"missing_information\"\
          )\n    action = request.get(\"proposed_action\")\n    if not isinstance(tasks,\
          \ list) or not isinstance(missing, list):\n        raise ValueError(\"tasks\
          \ / missing_information 必须是数组\")\n    if action not in (\"none\", \"save_itinerary\"\
          ):\n        raise ValueError(\"未知候选动作\")\n    if not all(isinstance(item,\
          \ str) for item in missing):\n        raise ValueError(\"missing_information\
          \ 元素必须是字符串\")\n    unsupported = request.get(\"unsupported_reason\")\n \
          \   candidate = request.get(\"candidate_text\")\n    if not isinstance(unsupported,\
          \ str) or not isinstance(candidate, str):\n        raise ValueError(\"unsupported_reason\
          \ / candidate_text 必须是字符串\")\n    groups = {\"travel\": [], \"life\": []}\n\
          \    seen = set()\n    missing = list(missing)\n    for task in tasks:\n\
          \        if not isinstance(task, dict) or task.get(\"kind\") not in (\"\
          weather\", \"poi\", \"utility\"):\n            raise ValueError(\"未知任务类型\"\
          )\n        if not all(\n            isinstance(task.get(key), str)\n   \
          \         for key in (\"id\", \"query\", \"city\", \"date\", \"utility_type\"\
          )\n        ):\n            raise ValueError(\"任务字段类型不正确\")\n        if not\
          \ task[\"id\"] or task[\"id\"] in seen or not task[\"query\"].strip():\n\
          \            raise ValueError(\"任务 ID 重复、为空或子任务没有描述\")\n        seen.add(task[\"\
          id\"])\n        deps = task.get(\"depends_on\")\n        if not isinstance(deps,\
          \ list) or not all(isinstance(item, str) for item in deps):\n          \
          \  raise ValueError(\"depends_on 必须是字符串数组\")\n        if deps:\n       \
          \     unsupported = \"本流程只执行独立子任务，请把有依赖的任务分开提交。\"\n        if not task[\"\
          city\"].strip():\n            missing.append(\"城市\")\n        if task[\"\
          kind\"] in (\"weather\", \"poi\"):\n            try:\n                if\
          \ date.fromisoformat(task[\"date\"]).isoformat() != task[\"date\"]:\n  \
          \                  raise ValueError\n            except ValueError:\n  \
          \              missing.append(\"具体日期（YYYY-MM-DD）\")\n        elif task[\"\
          utility_type\"] not in (\"water\", \"electricity\"):\n            missing.append(\"\
          水费还是电费\")\n        owner = \"life\" if task[\"kind\"] == \"utility\" else\
          \ \"travel\"\n        groups[owner].append(task)\n    if len(groups[\"travel\"\
          ]) > 1 or len(groups[\"life\"]) > 1:\n        unsupported = \"本流程每次最多处理一个旅游查询和一个生活服务查询。\"\
          \n    if action == \"save_itinerary\" and not candidate.strip() and not\
          \ tasks:\n        missing.append(\"待保存的行程文本\")\n    missing = list(dict.fromkeys(missing))\n\
          \    if unsupported:\n        route, message = \"unsupported\", unsupported\n\
          \    elif missing:\n        route, message = \"clarify\", \"请补充：\" + \"\
          、\".join(missing)\n    elif groups[\"travel\"] and groups[\"life\"]:\n \
          \       route, message = \"both\", \"\"\n    elif groups[\"travel\"]:\n\
          \        route, message = \"travel\", \"\"\n    elif groups[\"life\"]:\n\
          \        route, message = \"life\", \"\"\n    else:\n        route, message\
          \ = \"direct\", candidate.strip() or \"不客气。\"\n    active = route not in\
          \ (\"clarify\", \"unsupported\")\n    state = {\n        \"route\": route,\n\
          \        \"tasks\": tasks,\n        \"missing_information\": missing,\n\
          \        \"action\": action if active else \"none\",\n        \"candidate_text\"\
          : candidate.strip(),\n        \"message\": message,\n    }\n    return {\n\
          \        \"route\": route,\n        \"need_travel\": active and bool(groups[\"\
          travel\"]),\n        \"need_life\": active and bool(groups[\"life\"]),\n\
          \        \"travel_query\": json.dumps(groups[\"travel\"], ensure_ascii=False)\
          \ if active else \"[]\",\n        \"life_query\": json.dumps(groups[\"life\"\
          ], ensure_ascii=False) if active else \"[]\",\n        \"state_json\": json.dumps(state,\
          \ ensure_ascii=False),\n    }\n"
        code_language: python3
        desc: ''
        outputs:
