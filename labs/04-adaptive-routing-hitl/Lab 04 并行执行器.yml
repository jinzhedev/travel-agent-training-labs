    - data:
        code: "\"\"\"全文复制到“合并结果”Code 节点。\"\"\"\n\nimport json\n\n\ndef main(state_json:\
          \ str, travel_answer: str, life_answer: str, run_id: str) -> dict:\n   \
          \ state = json.loads(state_json)\n    route = state[\"route\"]\n    required\
          \ = {\"travel\": route in (\"travel\", \"both\"), \"life\": route in (\"\
          life\", \"both\")}\n    answers = {\"travel\": travel_answer.strip(), \"\
          life\": life_answer.strip()}\n    for owner, needed in required.items():\n\
          \        if needed != bool(answers[owner]):\n            raise ValueError(f\"\
          {owner} 执行结果缺失或出现了未分配的结果\")\n    pieces = (\n        [state[\"candidate_text\"\
          ]]\n        if state[\"candidate_text\"] and route not in (\"clarify\",\
          \ \"unsupported\")\n        else []\n    )\n    pieces.extend(f\"{owner}：{answers[owner]}\"\
          \ for owner in (\"travel\", \"life\") if required[owner])\n    answer =\
          \ \"\\n\\n\".join(pieces) or state[\"message\"]\n    needs_review = state[\"\
          action\"] != \"none\"\n    if not run_id or not answer:\n        raise ValueError(\"\
          缺少 run ID 或候选文本\")\n    state.update(\n        {\n            \"workflow_run_id\"\
          : run_id,\n            \"worker_answers\": {owner: value for owner, value\
          \ in answers.items() if required[owner]},\n            \"answer\": answer,\n\
          \            \"action_id\": f\"{run_id}:save_itinerary\" if needs_review\
          \ else \"\",\n            \"outcome\": \"pending_review\"\n            if\
          \ needs_review\n            else (route if route in (\"clarify\", \"unsupported\"\
          ) else \"auto_completed\"),\n            \"side_effect_count\": 0,\n   \
          \     }\n    )\n    return {\n        \"state_json\": json.dumps(state,\
          \ ensure_ascii=False),\n        \"answer\": answer,\n        \"needs_review\"\
          : needs_review,\n        \"action_id\": state[\"action_id\"],\n    }\n"
        code_language: python3
