    - id: travel_clean
      type: custom
      data:
        type: code
        title: 旅游最终回答
        desc: ''
        selected: false
        code_language: python3
        code: "\"\"\"复制到每个 Agent 后的 Code 节点；steps 绑定 Agent.json。\"\"\"\n\n\ndef main(steps:\
          \ list) -> dict:\n    rounds = [\n        step\n        for step in steps\n\
          \        if isinstance(step, dict)\n        and step.get(\"parent_id\")\
          \ is None\n        and str(step.get(\"label\", \"\")).startswith(\"ROUND\
          \ \")\n    ]\n    if not rounds:\n        raise ValueError(\"Agent 没有提供可核对的轮次结果\"\
          )\n    last = rounds[-1]\n    data = last.get(\"data\")\n    output = data.get(\"\
          output\") if isinstance(data, dict) else None\n    if (\n        last.get(\"\
          status\") != \"success\"\n        or not isinstance(output, dict)\n    \
          \    or \"tool_responses\" not in output\n        or output[\"tool_responses\"\
          ]\n    ):\n        raise ValueError(\"Agent 最后一轮尚未完成最终回答\")\n    answer\
          \ = output.get(\"llm_response\")\n    if not isinstance(answer, str) or\
          \ not answer.strip():\n        raise ValueError(\"Agent 最终回答为空\")\n    return\
          \ {\"text\": answer.strip()}\n"
        variables:
        - variable: steps
          value_selector:
          - travel
          - json
        outputs:
          text:
            type: string
            children: null
      position:
        x: 1600
        y: 30
      sourcePosition: right
      targetPosition: left
      width: 242
      height: 100
