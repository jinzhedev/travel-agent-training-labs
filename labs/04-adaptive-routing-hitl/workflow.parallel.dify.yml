              enabled: true
              extra:
                description: 按城市、日期和偏好搜索景点候选
              type: api
            - provider_name: 34525b01-25e6-4878-8f15-246a7b77862f
              provider_show_name: FullCatalogue
              plugin_id: null
              tool_name: weather_forecast
              tool_label: weather_forecast
              tool_description: 查询日期范围内的模拟天气预报，包括温度、晴雨和风况
              settings: {}
              parameters:
                X-API-Key:
                  auto: 0
                  value:
                    type: variable
                    value:
                    - env
                    - TRAVEL_CORE_API_KEY
                X-Tenant-ID:
